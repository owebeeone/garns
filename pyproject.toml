[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garns"
version = "0.9.6.dev0"
description = "A declarative language for deriving relational data systems from one meaning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["lark>=1.1"]

[project.scripts]
garns = "garns.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
